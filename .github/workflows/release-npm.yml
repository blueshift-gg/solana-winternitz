name: Release npm packages

run-name: "Release npm packages ${{ github.ref_name }}"

on:
  push:
    tags: ["v*", "npm-v*"]

jobs:
  check:
    name: Check release
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify packages/winternitz/package.json matches tag
        run: |
          v=$(jq -r '.version' packages/winternitz/package.json)
          expected="${GITHUB_REF_NAME#npm-v}"
          expected="${expected#v}"
          test "$v" = "$expected" \
            || { echo "::error::tag ${GITHUB_REF_NAME} does not match packages/winternitz/package.json version $v"; exit 1; }

      - name: Check npm versions not already published
        id: check
        run: |
          skip=true
          for dir in packages/winternitz packages/xmss; do
            name=$(jq -r '.name' "$dir/package.json")
            v=$(jq -r '.version' "$dir/package.json")
            if npm view "$name@$v" version >/dev/null 2>&1; then
              echo "$name $v is already published to npm"
            else
              echo "$name $v will be published"
              skip=false
            fi
          done
          if [[ "$skip" == true && "${GITHUB_REF_NAME}" == npm-v* ]]; then
            echo "::error::every package version is already published to npm; pick new versions"
            exit 1
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish npm packages
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: release-npm
      cancel-in-progress: false
    environment: release
    permissions:
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Set up Node.js (for npm publish)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # solana-winternitz first: solana-xmss depends on it.
      - name: Publish npm packages
        run: |
          for dir in packages/winternitz packages/xmss; do
            name=$(jq -r '.name' "$dir/package.json")
            v=$(jq -r '.version' "$dir/package.json")
            if npm view "$name@$v" version >/dev/null 2>&1; then
              echo "$name $v already published; skipping"
            else
              (cd "$dir" && npm publish --access public)
            fi
          done
