[package]
name = "solana-winternitz"
authors = ["L0STE"]
description = "Post-quantum hash-based signatures for Solana programs: DKKW25 generalized XMSS over target-sum Winternitz with Keccak-256, verified with the sol_keccak256 syscall"
license = "MIT"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/blueshift-gg/solana-winternitz"
keywords = ["solana", "winternitz", "post-quantum", "hash-based", "no-std"]
categories = ["cryptography", "no-std"]
include = ["/src", "/tests", "/LICENSE", "/README.md"]

[features]
default = []
# Host-only signing: secrets cannot be kept private on-chain.
sign = ["dep:getrandom"]
# Enable the static-syscall ABI when the toolchain omits its target feature.
static-syscalls = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(target_feature, values("static-syscalls"))',
] }

# Host Keccak-256. Never compiled for the Solana target, where it is a syscall.
[target.'cfg(not(target_os = "solana"))'.dependencies]
sha3 = { version = "0.10", default-features = false }
getrandom = { version = "0.3", optional = true }

[dev-dependencies]
getrandom = "0.3"
num-bigint = "0.4"
serde_json = "1"

[workspace]
members = ["program"]
default-members = ["."]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
