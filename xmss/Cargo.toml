[package]
name = "solana-xmss"
authors = ["L0STE"]
description = "Post-quantum hash-based signatures for Solana programs: a 256-leaf DKKW25 generalized XMSS tree over solana-winternitz's target-sum Winternitz keys, verified with the sol_keccak256 syscall"
license = "MIT"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/blueshift-gg/solana-winternitz"
keywords = ["solana", "xmss", "post-quantum", "hash-based", "no-std"]
categories = ["cryptography", "no-std"]
include = ["/src", "/tests", "/LICENSE", "/README.md"]

[features]
default = []
# Host-only signing: secrets cannot be kept private on-chain.
sign = ["solana-winternitz/sign"]
# Enable the static-syscall ABI when the toolchain omits its target feature.
static-syscalls = ["solana-winternitz/static-syscalls"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
solana-winternitz = { version = "0.3.0", path = "..", default-features = false }

[dev-dependencies]
solana-winternitz = { version = "0.3.0", path = "..", features = ["sign"] }
serde_json = "1"
